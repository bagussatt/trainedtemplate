services:

  db:
    image: postgres:17
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5436:5432"
    volumes:
      - ./.temp/db:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - '8080:8080'
